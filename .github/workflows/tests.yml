name: Tests

on:
  push:
    branches: [main, beta]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.9', '3.10', '3.11', '3.12', '3.13', '3.14']

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # Plugin transport deps (e.g. tls-client) so the http_client and client
          # tests run instead of skipping — CI exercises the full stack.
          for f in src/core/scrapers/*/requirements.txt; do
            [ -f "$f" ] && pip install -r "$f"
          done
          pip install -r requirements-dev.txt

      - name: Run tests
        run: pytest

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # SC2086/SC2046 are excluded: unquoted expansion of plugin lists is the
      # library's documented word-splitting idiom (see scripts/lib/common.sh).
      # -x follows the sourced common.sh via the "shellcheck source=" directives.
      - name: Run shellcheck
        run: shellcheck -x --exclude=SC2086,SC2046 install.sh update.sh scripts/*.sh scripts/lib/common.sh
