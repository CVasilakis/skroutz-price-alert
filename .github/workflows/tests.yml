name: Tests

on:
  push:
    branches: [main, beta]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # Plugin transport deps (e.g. tls-client) so the http_client and client
          # tests run instead of skipping — CI exercises the full stack.
          for f in src/core/scrapers/*/requirements.txt; do
            [ -f "$f" ] && pip install -r "$f"
          done
          pip install -r requirements-dev.txt

      - name: Run tests
        run: pytest
