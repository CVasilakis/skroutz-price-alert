# Test tooling configuration. The project ships no installable package (the app
# runs from the `core` package under src/ via PYTHONPATH), so this file is
# intentionally limited to pytest settings — it is not a packaging manifest.
[tool.pytest.ini_options]
# Put the app's import root (src/, home of the `core` package) and the tests
# root on sys.path so tests import production modules (`from core import tui`,
# `from core.scrapers...`) and the UI suite's `ui.*` package without any
# per-file sys.path juggling.
pythonpath = ["src", "tests"]
testpaths = ["tests"]
# Coverage is informational only. Keep the report, but do not add
# --cov-fail-under (or coverage.py's fail_under): low coverage must never make
# an otherwise successful test run fail.
addopts = "--cov=src/core --cov-report=term-missing:skip-covered"
# Apprise currently imports Python's deprecated imghdr module from this exact
# module. Suppress only that dependency-owned warning; every other warning
# category, message, and source module remains visible.
filterwarnings = [
    "ignore:^'imghdr' is deprecated and slated for removal in Python 3\\.13$:DeprecationWarning:apprise\\.utils\\.pgp$",
]

# Static-analysis configuration for Pyright / Pylance / basedpyright (basedpyright
# reads [tool.pyright] as a fallback). extraPaths mirrors pytest's `pythonpath`
# above so `core.*` (src/) and `ui.*` (tests/) resolve in the editor exactly as
# they do at runtime; pythonVersion pins diagnostics to the project's 3.10 floor.
[tool.pyright]
pythonVersion = "3.10"
extraPaths = ["src", "tests"]
venvPath = "."
venv = "venv"
# "standard" is the project baseline: full type-error checking without the
# opinionated extras (unused-call-result, Any-flow audits) that fight the Rich
# and apprise APIs. Raise locally if you want the stricter audit.
typeCheckingMode = "standard"

[tool.ruff]
target-version = "py310"
line-length = 100
# Markdown examples are intentionally hand-formatted for documentation clarity.
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.format]
quote-style = "double"
